# Continuous integration: lint, type-check and test on every push / PR.
# This needs no secrets and no network to Polymarket — the test suite is fully
# offline (it uses fakes/fixtures), which keeps CI fast and deterministic.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Black (format check)
        run: black --check src tests

      - name: Mypy (type check)
        run: mypy

      - name: Pytest
        run: pytest
